# Lint, typecheck, test and migration round-trip (docs/14). The jobs are separated by what a
# failure means, not to parallelise: a lint failure is untidy, a drift failure means generated
# files do not match their source, and a test failure means the product is wrong.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege for the GITHUB_TOKEN: no job here pushes, comments or logs in
# to a registry, so read-only contents is all any of them needs. Without this
# block the token takes the repository/organisation default, which on older
# settings is read-write on everything.
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  # Mirrors infra/docker-compose.yml. These only ever address services
  # inside the runner, and are the same literals the compose file uses.
  DATABASE_URL: postgresql+psycopg://noctornal:dev_only_change_me@localhost:5432/noctornal
  # The gate on apps/api/tests/test_app_role_privileges_pg.py, which asserts what migration 0060
  # granted the least-privilege runtime role; unset, the file skips and the "No tests were
  # skipped" gate fails the build. It names a role, so it must match 0060's APP_ROLE: the first
  # test compares the two. The role is created by a step below.
  NOCTORNAL_APP_DB_ROLE: noctornal_app
  # The system role the row-level security tests hold equal to the app role but for the IAM-plane
  # writes.
  NOCTORNAL_WORKER_DB_ROLE: noctornal_worker
  # The same for the egress proxy's own database role: db/init/20-egress-role.sh creates it, a
  # migration grants to it, and a test checks the grant, which would skip without these.
  # Throwaways like every credential here.
  NOCTORNAL_EGRESS_DB_ROLE: noctornal_egress
  NOCTORNAL_EGRESS_DB_PASSWORD: dev_only_change_me
  # The runner's gpg is Ubuntu 24.04's distribution build, which reports 2.4.4, below the version
  # floor PGP verification enforces (docs/17). Without this attestation, which each verification
  # row records, every VERIFIED test would record NO_VERIFIER. A deployment sets it only after
  # checking its own distribution's changelog.
  NOCTORNAL_GPG_PATCHED_AS: "2.4.9"
  # The rate limiter's Lua runs in Redis, not in Python, so the only way to
  # know the two implementations still agree is to run both. Without this
  # the Redis leg would skip -- and the "No tests were skipped" gate below
  # would then fail the build, which is the intended behaviour.
  REDIS_URL: redis://localhost:6379/0
  # As for REDIS_URL, for the SMTP leg: the Mailpit round-trip test is gated on SMTP_HOST. The
  # port and the plaintext flag mirror infra/docker-compose.yml and what install.sh writes into
  # .env.local.
  SMTP_HOST: localhost
  SMTP_PORT: "1025"
  SMTP_ALLOW_PLAINTEXT: "1"
  # Again, for the production Redis ACL: test_redis_limiter_acl.py proves the ACL confines the
  # limiter, and the limiter works under it, against a Redis started with the production compose
  # file's own start script ("Start the ACL Redis" below). The tenant is a second user that step
  # adds, standing for another tenant of a shared Redis. Throwaways like every credential here.
  NOCTORNAL_TEST_ACL_REDIS_URL: redis://noctornal_limiter:dev_only_change_me@localhost:6390/0
  NOCTORNAL_TEST_ACL_REDIS_TENANT_URL: redis://acl_tenant:dev_only_change_me@localhost:6390/0
  MINIO_ENDPOINT: localhost:9000
  MINIO_ACCESS_KEY: noctornal
  MINIO_SECRET_KEY: dev_only_change_me
  EVIDENCE_BUCKET: noctornal-evidence
  SAMPLE_BUCKET: noctornal-samples
  # Raw markup of collected forum pages. No object lock: it is deleted with its document.
  COLLECT_RAW_BUCKET: noctornal-collect-raw
  # A fixed, throwaway KEK; real deployments supply it from the environment or Vault, and the code
  # has no default (security/envelope.py). It must decode to exactly 32 bytes: base64 of 32 'A'
  # bytes, matching apps/api/tests/conftest.py.
  NOCTORNAL_TOTP_KEK: QUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUE=

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pipx install ruff==0.6.9
      - name: Ruff
        run: ruff check apps packages scripts db

  source-hygiene:
    name: Source hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # Editing tools have corrupted non-ASCII literals into NUL bytes (docs/15), and a NUL in a
      # served .js file is a blank screen with nothing in the console.
      - name: No NUL bytes in source
        run: python scripts/check_source_hygiene.py

  pinned-images:
    name: Pinned images resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      # A digest copied from a local image store can name a manifest the
      # registry never had (an image pulled from one registry and re-tagged
      # for another), and the host that copied it starts the stack from its
      # own store, so only a clean machine fails. Ask each registry.
      - name: Every pinned image resolves in its registry
        run: |
          set -euo pipefail
          refs=$(grep -hoE '[A-Za-z0-9./_:-]+@sha256:[0-9a-f]{64}' \
                   infra/docker-compose.yml infra/production/compose.yml Dockerfile | sort -u)
          [ -n "$refs" ]
          for ref in $refs; do
            docker buildx imagetools inspect "$ref" > /dev/null
            echo "resolves: $ref"
          done

  drift:
    name: Ontology drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # Pinned like every other install here (constraints.txt, below).
      - run: pip install -c constraints.txt -e packages/ontology
      # The ontology generates TypeScript and SQL from one definition. If
      # the generated files stop matching, edge-type strings drift between
      # the front end and the database, which is silent data corruption
      # rather than a crash (packages/ontology README).
      - name: Generated files match the definition
        run: python -m noctornal_ontology.generate --check

  # Two legs of one job. The first installs every optional extra (telegram, yara) and runs the
  # suite except the tests marked extras_absent; the second, the configuration most deployments
  # have, installs none and runs only those. A matrix rather than a second job, so both legs get
  # the same services, extensions, roles, buckets and migrations from one definition. The first
  # leg's name is the check name branch rules use.
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Tests and migrations
            extras: dev,telegram,yara
            select: not extras_absent
            full: true
          - name: Tests without optional extras
            extras: dev
            select: extras_absent
            full: false
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: noctornal
          POSTGRES_USER: noctornal
          POSTGRES_PASSWORD: dev_only_change_me
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U noctornal"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
      # MinIO is not a service container but a `docker run` step below: its image needs the
      # argument `server /data`, which a service container cannot pass, and the step uses the
      # same image as infra/docker-compose.yml. That is a pinned build mirrored byte for byte to
      # this project's GHCR namespace, since public registries stopped serving it anonymously.

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        run: |
          # -c constraints.txt on every install: the exact versions the release's suite passed on,
          # the same a developer or an installer has. test_dependency_pins.py holds this file, the
          # installers and the Dockerfile to it, and the installed environment to the pins.
          pip install -c constraints.txt -r db/requirements.txt
          # The `dev` extra is the declared test toolset, so nothing the suite needs is listed by
          # hand. The first leg adds the optional extras ("dev,telegram,yara"), whose suites must
          # run there, never skip; the no-skip gate below holds them to it.
          pip install -c constraints.txt -e packages/ontology -e "apps/api[${{ matrix.extras }}]"

      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=noctornal \
            -e MINIO_ROOT_PASSWORD=dev_only_change_me \
            ghcr.io/dboudreau00/minio:RELEASE.2025-04-22T22-12-26Z server /data
          # Wait for readiness rather than sleeping: a fixed sleep is either
          # too short on a slow runner or wasted on a fast one.
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:9000/minio/health/live >/dev/null 2>&1; then
              echo "MinIO ready after ${i} attempt(s)"; exit 0
            fi
            sleep 2
          done
          echo "MinIO did not become ready; logs follow:" >&2
          docker logs minio >&2
          exit 1

      - name: Start Mailpit
        run: |
          # A step, not a service container: the health check has to reach Mailpit's own /readyz,
          # and `docker run` keeps CI on the image and ports infra/docker-compose.yml uses. The
          # same pinned tag as that file, since `:latest` is a dependency on somebody else's
          # release day; test_dependency_pins.py fails if the two tags differ.
          docker run -d --name mailpit \
            -p 1025:1025 -p 8025:8025 \
            axllent/mailpit:v1.31.0
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8025/readyz >/dev/null 2>&1; then
              echo "Mailpit ready after ${i} attempt(s)"; exit 0
            fi
            sleep 2
          done
          echo "Mailpit did not become ready; logs follow:" >&2
          docker logs mailpit >&2
          exit 1

      # The production Redis ACL, for test_redis_limiter_acl.py's real-Redis leg; the `redis`
      # service above is the development shape, with no user, which the Lua agreement tests need.
      # This runs infra/production/compose.yml's own start script, rendered by
      # apps/api/tests/acl_redis_support.py with the tenant user added, in the image that file
      # names; REDIS_URL names host `redis` inside, so the script takes production's branch. A step
      # because a service container cannot be given a command, and after Install because the
      # renderer imports the suite's compose reader.
      - name: Start the ACL Redis
        run: |
          python apps/api/tests/acl_redis_support.py --tenant > /tmp/acl-redis-start.sh
          docker run -d --name acl-redis \
            -p 127.0.0.1:6390:6379 \
            -e REDIS_PASSWORD=dev_only_change_me \
            -e REDIS_URL=redis://noctornal_limiter:dev_only_change_me@redis:6379/0 \
            -e ACL_TENANT_PASSWORD=dev_only_change_me \
            -v /tmp/acl-redis-start.sh:/acl-redis-start.sh:ro \
            redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499 \
            /bin/sh /acl-redis-start.sh
          # The compose file's own healthcheck, signed in as the limiter.
          for i in $(seq 1 40); do
            if docker exec -e REDISCLI_AUTH=dev_only_change_me acl-redis \
                 redis-cli --user noctornal_limiter ping 2>/dev/null | grep -q PONG; then
              echo "ACL Redis ready on attempt ${i}"; exit 0
            fi
            sleep 1
          done
          echo "The ACL Redis did not become ready; logs follow:" >&2
          docker logs acl-redis >&2
          exit 1

      # CREATE EXTENSION needs superuser, which the migration role must never be, so extensions
      # are loaded out of band as db/init does on a real deployment, and Alembic owns everything
      # else (decision 17).
      - name: Load extensions
        run: |
          PGPASSWORD=dev_only_change_me psql -h localhost -U noctornal \
            -d noctornal -v ON_ERROR_STOP=1 -f db/init/00-extensions.sql

      # The other half of db/init, run by name: this job never mounts that directory, so the
      # postgres entrypoint never sources 10-app-role.sh. Before "Migrate to head", because
      # migration 0060 grants only a role that already exists (db/README.md). The script is run,
      # not copied, so the role is declared once; `sh <file>` because it is committed 100644 on
      # purpose, as the entrypoint sources a non-executable init script. PGHOST and PGPASSWORD are
      # the only difference from a deployment, which runs it in the container over a unix socket.
      - name: Create the least-privilege runtime role
        env:
          PGHOST: localhost
          PGPASSWORD: dev_only_change_me
          POSTGRES_USER: noctornal
          POSTGRES_DB: noctornal
          # A throwaway, and unused: the suite reads the catalog over the owner's connection,
          # since the *_pg files that run ALTER TABLE ... DISABLE TRIGGER need ownership, which
          # this role exists to lack.
          NOCTORNAL_APP_DB_PASSWORD: dev_only_change_me
          # The same script creates the system role noctornal_worker (BYPASSRLS) when this is
          # set, before "Migrate to head" so migration 0108 grants it; the row-level security
          # tests reach it with SET ROLE and fail, not skip, without it.
          NOCTORNAL_WORKER_DB_PASSWORD: dev_only_change_me
        run: sh db/init/10-app-role.sh

      # The egress proxy's role, before "Migrate to head" for the same reason: the migration that
      # grants to it skips a role that does not exist yet. db/init/20-egress-role.sh follows
      # 10-app-role.sh, and its psql finds the server through PGHOST; without the file the step
      # does nothing.
      - name: Create the egress proxy role
        env:
          PGHOST: localhost
          PGPASSWORD: dev_only_change_me
          POSTGRES_USER: noctornal
          POSTGRES_DB: noctornal
        run: |
          if [ -f db/init/20-egress-role.sh ]; then sh db/init/20-egress-role.sh; fi

      # The evidence bucket needs object lock, which cannot be enabled after creation: wrong here,
      # the WORM tests would pass against a bucket with no WORM. `mc` runs from the pinned image
      # the compose files use, through `MC_HOST_<alias>`, because each `docker run --rm` is a fresh
      # container and an alias would not survive to the next. Upstream MinIO is archived and gets
      # no security fixes, a risk docs/17 and docs/16 record.
      - name: Create the object-store buckets
        run: |
          mc() {
            docker run --rm --network host \
              -e MC_HOST_local="http://noctornal:dev_only_change_me@localhost:9000" \
              ghcr.io/dboudreau00/mc:RELEASE.2025-08-13T08-35-41Z "$@"
          }
          for i in $(seq 1 30); do
            mc ls local >/dev/null 2>&1 && break
            sleep 2
          done
          mc mb --ignore-existing --with-lock local/noctornal-evidence
          mc retention set --default GOVERNANCE 365d local/noctornal-evidence
          mc mb --ignore-existing local/noctornal-raw
          # The samples bucket, not --with-lock: docs/11's rejection path must be able to destroy
          # sample bytes, which an object lock would prevent.
          mc mb --ignore-existing local/noctornal-samples
          # Rejected samples are preserved here by default under a per-object legal hold, so this
          # one is --with-lock, with no default retention; test_sample_preservation_pg.py needs
          # the lock to be real.
          mc mb --ignore-existing --with-lock local/noctornal-preserved
          # Raw markup of collected forum pages. Not --with-lock: it is deleted with its document.
          mc mb --ignore-existing local/noctornal-collect-raw

      - name: Migrate to head
        run: alembic upgrade head

      # db/schema.sql is a generated mirror of the schema at head: regenerate and diff against the
      # committed file, as the ontology drift gate does. Against the first upgrade, before the
      # round-trip, so a non-reversible migration's residue fails the round-trip under its own
      # name. pg_dump runs inside the postgres service container (the pgvector:pg16 image the
      # compose file uses) so both sides agree on its formatting. First leg only: the schema does
      # not depend on the extras.
      - name: Schema mirror matches the migrations
        if: ${{ matrix.full }}
        env:
          NOCTORNAL_PG_DUMP: docker exec ${{ job.services.postgres.id }} pg_dump
        run: python scripts/dump_schema.py --check

      # Every migration is required to be reversible (CONVENTIONS.md
      # conventions). Round-tripping the WHOLE chain is the only way to
      # find the one that silently is not -- and it has caught a real
      # defect already: 0026 originally only applied to an empty table.
      - name: Migration round-trip (head -> base -> head)
        if: ${{ matrix.full }}
        run: |
          alembic downgrade base
          alembic upgrade head
          alembic current

      # `-m` selects by the extras_absent marker: the whole suite less the marked tests on the
      # first leg, the marked tests alone on the second. A leg that selects nothing fails (pytest
      # exit status 5).
      - name: Tests
        run: |
          # One run, kept with its skip reasons for the gate below: migrations 0083, 0085 and 0086
          # refuse their downgrade over append-only history, so the round-trip tests cannot pass
          # on a used database. pipefail: the step's status is pytest's, not tee's.
          set -o pipefail
          pytest apps/api/tests packages/ontology/tests -q -rs -m "${{ matrix.select }}" 2>&1 | tee /tmp/tests.out

      # The audit chain verification job (docs/09): a chain that is never recomputed makes
      # tamper-evidence a claim rather than a control. After the suite, so the chain has real
      # traffic in it; an empty chain would pass and prove nothing, so the step fails if nothing
      # was checked. First leg only: the second leaves too short a chain to be worth verifying.
      - name: Audit chain verifies
        if: ${{ matrix.full }}
        run: |
          python - <<'PY'
          import sys
          from noctornal_api.audit_verify import verify_chain
          from noctornal_api.db import connect

          report = verify_chain(connect())
          print(f"checked {report.checked} events, "
                f"seq {report.first_seq}..{report.last_seq}")
          if report.checked == 0:
              print("::error::No audit events to verify. The suite ran "
                    "without writing any, or the chain was truncated.")
              sys.exit(1)
          # A fork is two rows claiming one predecessor. Rows written before migration 0149 can
          # fork under honest concurrent traffic (`seq` was drawn before the chaining trigger took
          # its lock), so those are only noticed; a fork among rows written since is in
          # `report.breaks` and fails the build. This database is built from nothing, so every fork
          # here is the latter kind.
          print(f"tail seq {report.tail_seq}, hash {report.tail_row_hash}")
          if report.forks:
              print(f"::warning::{len(report.forks)} audit rows share a "
                    f"predecessor (see the breaks below for any written "
                    f"after migration 0149).")
          for b in report.breaks:
              print(f"::error::audit chain {b.kind} break at seq {b.seq} "
                    f"({b.action} at {b.occurred_at})")
          sys.exit(1 if report.breaks else 0)
          PY

      # The same for the other tamper-evident ledger, core.evidence_custody (hash-chained since
      # migration 0024), the record produced to a court. After the suite, whose evidence,
      # provenance and e2e tests leave real custody rows in place. `checked == 0` fails: it catches
      # suites that write no custody rows, or an emptied ledger, but not a partial truncation,
      # which leaves every check green (see "What this cannot see" in custody_verify.py). So
      # `tail_row_hash` is printed for an operator to record out of band and compare on the next
      # run, the only thing that reveals a tail deletion; the workflow does not store it. The
      # anchor (`genesis_count`) is checked explicitly: the one removal the relative checks see.
      # First leg only, as above.
      - name: Custody chain verifies
        if: ${{ matrix.full }}
        run: |
          python - <<'PY'
          import sys
          from noctornal_api.custody_verify import verify_custody_chain
          from noctornal_api.db import connect

          report = verify_custody_chain(connect())
          print(f"checked {report.checked} custody rows, "
                f"id {report.first_id}..{report.last_id}, "
                f"genesis_count {report.genesis_count}, "
                f"tail_row_hash {report.tail_row_hash}")
          if report.checked == 0:
              print("::error::No custody rows to verify. The suite ran "
                    "without writing any, or the ledger was emptied "
                    "entirely. This gate does NOT catch a partial "
                    "truncation -- deleting the NEWEST rows leaves this "
                    "step green; compare tail_row_hash across runs.")
              sys.exit(1)
          # As for the audit chain above: a fork written since 0149 is a
          # break and fails this step; older ones are history.
          if report.forks:
              print(f"::warning::{len(report.forks)} custody rows share a "
                    f"predecessor. Those from before migration 0149 are not "
                    f"counted as tampering; any written after it is in the "
                    f"breaks below.")
          for b in report.breaks:
              print(f"::error::custody chain {b.kind} break at id {b.id} "
                    f"({b.action} on {b.evidence_id} at {b.occurred_at})")
          sys.exit(1 if report.breaks else 0)
          PY

      # The suite must not quietly become unit-only because a service died:
      # every _pg test skips without DATABASE_URL, so a broken Postgres
      # service would show as a green run with 100+ skips.
      - name: No tests were skipped
        run: |
          # The Tests step's own run, read back: the same selection on each
          # leg, and no second run on a used database. Deselected tests are
          # reported as "N deselected", never as skipped, so the grep below
          # reads only real skips.
          test -s /tmp/tests.out || { echo "::error::the Tests step left no output"; exit 1; }
          grep -E "^SKIPPED" /tmp/tests.out || true
          if grep -qE "^[0-9]+ passed, [0-9]+ skipped" /tmp/tests.out; then
            echo "::error::Tests were SKIPPED. The Postgres or MinIO leg is not running."
            exit 1
          fi
