# Who may connect to the production database, and how (infra/production/compose.yml passes this
# file as hba_file, so it replaces the one initdb wrote into the data volume, on a new volume and
# on an existing one alike).
#
# Inside the container, over the unix socket and the loopback address, as the image's own initdb
# allows: the healthcheck, the init scripts in db/init and the README's psql, pg_dump and
# pg_restore run there. From the network, TLS and a password, and nothing else: there is no
# `host` line, so a client that leaves sslmode out is refused by the server rather than answered
# in plain text. The clients ask for sslmode=verify-full, which also checks the server's name
# against the CA scripts/internal_tls.py issued, and production refuses to start one that does not.
#
# TYPE   DATABASE  USER  ADDRESS        METHOD
local    all       all                  trust
host     all       all   127.0.0.1/32   trust
host     all       all   ::1/128        trust
hostssl  all       all   all            scram-sha-256
