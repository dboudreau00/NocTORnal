# The production deployment: one host, docker compose, nothing else.
#
#   sudo docker compose -p noctornal-prod -f infra/production/compose.yml up -d
#
# Read infra/production/README.md first. This file needs secrets.env and caddy.env beside it,
# and a correct stack still starts with readiness items that only a human can close; while the
# blocking ones (`readiness.BLOCKING_CHECKS`) are open, the collection poll route answers 409.
#
# How it differs from infra/docker-compose.yml, which is not a base for production:
#
#   * Two Postgres roles: `noctornal` owns the schema and runs Alembic, and every runtime process
#     connects as the least-privilege `noctornal_app`. Dev keeps one because the test suite runs
#     ALTER TABLE ... DISABLE TRIGGER, which only the owner may. The owner's password and DSN live
#     in postgres-init.env and migrate.env (x-no-owner-credential); an older secrets.env has them
#     moved out by `sudo bash release/install.sh --production-secrets`.
#   * Redis runs `noeviction`, as dev does, but with an ACL and reachable only from the compose
#     network.
#   * The evidence bucket has a COMPLIANCE default retention where dev keeps GOVERNANCE (see
#     minio-init).
#   * Nothing is published but Caddy's 80 and 443. Dev publishes six ports, on 127.0.0.1 only;
#     here Postgres, Redis, MinIO and both application processes are reachable only from the
#     compose network.
#
# Not provided: HA or failover, backup beyond the named volumes on this disk (a lost volume is a
# lost case file), log aggregation, metrics or alerting. The legal items docs/16 L1-L5 are open,
# and no compose file can close them.
#
# Egress (docs/00 decision 68): the `noctornal` network is internal, so the application reaches
# the outside world only through the egress proxy. Its keys are in egress-proxy.env and
# egress-client.env and its database password in postgres-init.env, never in secrets.env. All
# three are optional to compose (2.24 or later), so an upgrade starts and the processes refuse,
# naming what is missing (infra/production/README.md, Egress; release/egress-upgrade/README.md).

name: noctornal-prod

# --------------------------------------------------------------------------
# Caddy's fixed address on the internal network, declared once.
#
# uvicorn's --forwarded-allow-ips "*" would set `request.client` from the first X-Forwarded-For
# entry, which the caller writes, and http/routers/ingest.py checks its allowlist against
# `request.client.host` (failing closed on an unknown peer). Naming this one trusted proxy makes
# uvicorn read the header from the right and return the address Caddy saw, which Caddy appends
# and the caller cannot forge. The network reserves the address for Caddy, and api and
# sample-origin pass it to uvicorn as NOCTORNAL_TRUSTED_PROXY_IP; were the two to drift, every
# request would meter and audit as coming from the proxy. A new value must sit inside the subnet
# under `networks:` and outside its `ip_range`.
x-caddy-ip: &caddy_ip "172.31.243.10"

# The egress proxy's fixed address on the internal network: clients reach it through
# NOCTORNAL_EGRESS_PROXY_URL, and it listens there alone (NOCTORNAL_EGRESS_LISTEN). A YAML alias
# cannot be spliced into a string, so both values repeat it, and a test holds them equal to this.
# Like Caddy's, it stays outside the network's `ip_range`.
x-egress-ip: &egress_ip "172.31.243.11"

# --------------------------------------------------------------------------
# Every container's log, bounded. Docker's json-file driver keeps everything by default, so a
# host left alone fills its disk, and Postgres is the first to stop. 5 x 10 MiB keeps days of the
# busiest log and caps the stack near 750 MiB. A host that ships logs elsewhere changes the
# driver here, but `docker compose logs` reads only json-file and local. Merged into every
# service; a test holds that none is without it.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# --------------------------------------------------------------------------
# Everything that runs the application image.
#
# Only `migrate` builds it; every other service runs the tag with `pull_policy: never`, which
# also keeps compose from asking Docker Hub for an image that only this host builds. With Docker
# Engine 29's containerd image store and Compose 2.40, which builds through bake, each service
# carrying `build:` exports the same tag and the second export fails with "already exists".
# Compose builds every image a command needs before it creates any container, so
# `up -d --build` is enough, but `docker compose run` before the first build says "No such
# image". A test holds the shape.
#
# The tag tracks apps/api/pyproject.toml's version, its one declaration. `up -d` reuses a local
# tag, so after a code change run `up -d --build` or the old image is redeployed.
#
# `./tls` carries MinIO's certificate, from which each application service builds a CA bundle at
# start (see the api service). `migrate` shares the mount but not this env_file: it reads
# migrate.env alone.
#
# No capabilities and no-new-privileges: the process is uid 10001 and needs none, and dropping
# them all takes CAP_NET_RAW (reading or spoofing a hop on the bridge) out of the bounding set.
# The root filesystem stays writable because the CA bundle and the Lab's child processes write
# /tmp (infra/production/README.md, Hardening).
x-noctornal-app: &noctornal-app
  image: noctornal-api:0.9.4
  pull_policy: never
  env_file: [secrets.env]
  networks: [noctornal]
  restart: unless-stopped
  logging: *logging
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  volumes:
    - ./tls:/certs:ro

# The schema owner's password and DSN, blanked on every runtime service. They belong in
# postgres-init.env and migrate.env, but secrets.env reaches most services, and a line pasted
# back into it would hand the owner's credential to all of them. `environment:` wins over
# env_file, and the API, the cron jobs and the egress proxy treat an empty value as unset. Merged
# with `<<:`; a test holds that every service but postgres and migrate carries it, Caddy and the
# egress proxy included, so a line pasted into their own env files reaches nothing either.
x-no-owner-credential: &no-owner-credential
  POSTGRES_PASSWORD: ""
  NOCTORNAL_MIGRATION_DATABASE_URL: ""

services:

  # ------------------------------------------------------------------------
  # The only service with a published port. Caddy terminates TLS for both hostnames and proxies
  # to the two application processes, appending the X-Forwarded-For entry that
  # NOCTORNAL_TRUSTED_PROXY_HOPS=1 tells them to read. 443/udp is not published: 80 and 443 are
  # the whole published surface, so HTTP/3 is unavailable from outside.
  #
  # It reads caddy.env alone: the two hostnames and the TLS mode. Its one capability is
  # NET_BIND_SERVICE, which the caddy binary carries as a file capability and cannot exec
  # without. Without NET_RAW a compromised Caddy cannot read or spoof the plaintext Postgres and
  # Redis hops on the bridge. The root filesystem is read-only (Caddy writes its two volumes
  # only), so the one "failed to install root certificate" line under NOCTORNAL_TLS_MODE=internal
  # is harmless. It still runs as uid 0 because caddy-data and caddy-config are root's on a
  # running deployment; infra/production/README.md, Hardening, has the chown that allows a
  # `user:`.
  #
  # It routes out through `edge` as the TLS terminator, outside the egress proxy's scope (docs/00
  # decision 68).
  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    logging: *logging
    env_file: [caddy.env]
    environment:
      <<: *no-owner-credential
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # caddy-data holds the ACME account key and every issued certificate.
      # Losing it means re-issuing, and Let's Encrypt rate-limits that per
      # hostname per week -- so a `down -v` here is not the cheap operation
      # it looks like.
      - caddy-data:/data
      - caddy-config:/config
    # `edge` carries the published ports and ACME; `noctornal` keeps
    # the fixed address the application trusts (NOCTORNAL_TRUSTED_PROXY_IP).
    networks:
      noctornal:
        ipv4_address: *caddy_ip
      edge:
    depends_on: [api, sample-origin]

  # ------------------------------------------------------------------------
  # The image and tuning flags of infra/docker-compose.yml, so a query plan measured in
  # development holds here. Pinned by digest; infra/production/README.md, Hardening, says how to
  # move it.
  #
  # The entrypoint starts as root, chowns the data directory and drops to the postgres user,
  # which needs the five capabilities below and no others.
  #
  # A statement slower than log_min_duration_statement is logged with its bind parameters, which
  # hold third-party text, addresses, hashes and sealed blobs. The two log_parameter_max_length
  # flags in the command below stop that for every role (a comment cannot go inside that folded
  # block); the role settings in db/init/10-app-role.sh stay as a second line.
  postgres:
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    restart: unless-stopped
    logging: *logging
    networks: [noctornal]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    # Docker's default /dev/shm is 64 MB; a parallel query's shared memory
    # outgrows it under load and fails with DiskFull, an HTTP 500 to the
    # analyst (measured at 50 concurrent users on a case of a million claims).
    shm_size: 1gb
    # postgres-init.env carries the passwords only initdb reads (the owner's POSTGRES_PASSWORD,
    # the system role's and the egress role's NOCTORNAL_EGRESS_DB_PASSWORD), and only this
    # service reads it. It is optional because an existing volume needs none of them; the image
    # itself refuses a new volume without POSTGRES_PASSWORD.
    env_file:
      - secrets.env
      - path: postgres-init.env
        required: false
    environment:
      POSTGRES_DB: noctornal
      # The owner role and bootstrap superuser: Alembic runs as it, nothing at runtime does. Its
      # password, from postgres-init.env, must be the one in migrate.env's
      # NOCTORNAL_MIGRATION_DATABASE_URL; `release/install.sh --production-secrets` compares them.
      POSTGRES_USER: noctornal
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c log_min_duration_statement=250
      -c log_parameter_max_length=0
      -c log_parameter_max_length_on_error=0
      -c max_connections=200
      -c shared_buffers=512MB
      -c work_mem=32MB
    # db/init, as in dev: CREATE EXTENSION needs superuser, so extensions load here and the
    # schema comes from Alembic alone. 10-app-role.sh creates the least-privilege role from
    # NOCTORNAL_APP_DB_PASSWORD (env_file, with the other secrets); when that is absent it creates
    # none and says so, which suits dev and CI but not this deployment.
    #
    #   * Init scripts run once, on an empty data directory: changing NOCTORNAL_APP_DB_PASSWORD
    #     later needs ALTER ROLE by hand.
    #   * A failed init leaves a partial cluster that reports healthy and never reruns the
    #     scripts. With no data yet, recover with `down -v` and up again; after that, restore a
    #     backup.
    volumes:
      - prod-pgdata:/var/lib/postgresql/data
      - ../../db/init:/docker-entrypoint-initdb.d:ro
    # -h 127.0.0.1 matters: during first-run init the temporary server listens on the unix
    # socket only, so a socket probe would report healthy before the extensions exist.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U noctornal -d noctornal"]
      interval: 5s
      retries: 10
      start_period: 30s

  # ------------------------------------------------------------------------
  # The rate limiter's meter store, not a cache: `noeviction`, as in dev. An evicted GCRA meter
  # admits the subject it was refusing with a full burst, so readiness._redis_limiter_store
  # fails on any evicting policy. With noeviction `--maxmemory` is a circuit breaker: at the cap
  # Redis refuses writes and each limit falls to its own on_backend_failure, which is visible.
  #
  # The password is read from the container environment (`$$`), not interpolated by compose, so
  # `docker compose config` never prints it and the operator need not export it.
  #
  # The ACL turns `default` off, so an unauthenticated client is refused, and makes
  # `noctornal_limiter` the only user: keys under `rl:`, the commands of
  # ratelimit_redis.limiter_acl_rules() (a test holds the text below equal to it), no pub/sub.
  # Past its own keys it sees only key names (SCAN), server statistics (INFO) and user rules and
  # password hashes (ACL GETUSER). In production readiness reads the ACL back and fails
  # `redis_limiter_isolated` when it differs. The file is written at each start into /tmp under
  # umask 077 and holds the password's SHA-256, never the password, so it cannot drift from
  # secrets.env and a new password costs a restart.
  #
  # REDIS_URL is checked before the server starts. One that names this service (host `redis`,
  # compared in lower case) but would not sign in as noctornal_limiter with REDIS_PASSWORD, or
  # that names no host, would leave every fail-closed limit refusing everyone, the login
  # included, so the service refuses to start and names the installer step that rewrites the
  # URL; api and cron wait for it. A URL naming another host is the operator's own Redis
  # (infra/production/README.md, The limiter's Redis): this one then starts with its ACL and no
  # client, and says so.
  #
  # The healthcheck signs in as the limiter, since `default` cannot. Pinned by digest. The
  # command replaces the image's start, which is what would switch to the redis user, so this
  # runs as root with DAC_OVERRIDE alone, without which it cannot open its append-only directory.
  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: unless-stopped
    logging: *logging
    networks: [noctornal]
    env_file: [secrets.env]
    environment:
      <<: *no-owner-credential
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    volumes: [prod-redisdata:/data]
    command:
      - /bin/sh
      - -c
      - |
        if [ -z "$$REDIS_PASSWORD" ]; then
          echo 'REDIS_PASSWORD is empty: refusing to start.' >&2
          echo 'It is the password of noctornal_limiter, the only user this' >&2
          echo 'Redis has, and an empty one would let any container in.' >&2
          exit 1
        fi
        host=$${REDIS_URL#*://}
        host=$${host%%[/?#]*}
        host=$${host##*@}
        host=$${host%:*}
        host=$$(printf '%s' "$$host" | tr 'A-Z' 'a-z')
        case "$$REDIS_URL" in
          "redis://noctornal_limiter:$$REDIS_PASSWORD@"*) ;;
          *://*)
            if [ -z "$$host" ] || [ "$$host" = redis ]; then
              echo 'REDIS_URL does not sign in to this Redis as noctornal_limiter with REDIS_PASSWORD: refusing to start.' >&2
              echo 'This Redis disables its default user, so the limiter would be refused and every' >&2
              echo 'limit that fails closed would refuse everyone. Run sudo bash release/install.sh' >&2
              echo '--production-secrets (release/install.ps1 -ProductionSecrets on Windows), which' >&2
              echo 'rewrites REDIS_URL and keeps a backup (release/secrets-upgrade/README.md).' >&2
              exit 1
            fi
            echo 'REDIS_URL names a Redis on another host, so the limiter does not use this one,' >&2
            echo 'which starts with its ACL and no client (infra/production/README.md, The' >&2
            echo "limiter's Redis, says what that Redis needs and how to leave this one out)." >&2
            ;;
          *)
            echo 'REDIS_URL is empty or not a URL: refusing to start. Run sudo bash release/install.sh' >&2
            echo '--production-secrets (release/install.ps1 -ProductionSecrets on Windows), which' >&2
            echo 'writes one that signs in to this Redis (release/secrets-upgrade/README.md).' >&2
            exit 1
            ;;
        esac
        umask 077
        hash=$$(printf '%s' "$$REDIS_PASSWORD" | sha256sum | cut -d ' ' -f 1)
        printf 'user default off resetpass resetkeys resetchannels -@all\n' > /tmp/users.acl
        printf 'user noctornal_limiter on #%s resetkeys ~rl:* resetchannels -@all +evalsha +script|load +get +set +time +ping +info +dbsize +scan +acl|whoami +acl|getuser\n' "$$hash" >> /tmp/users.acl
        exec redis-server \
          --appendonly yes \
          --maxmemory 1gb \
          --maxmemory-policy noeviction \
          --aclfile /tmp/users.acl
    healthcheck:
      # The password goes in REDISCLI_AUTH, not `-a`: an argument sits on the command line of a
      # process that starts every five seconds, where any local account on the host can read
      # it. The user name is not a secret.
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli --user noctornal_limiter ping | grep -q PONG']
      interval: 5s
      retries: 10
      start_period: 10s

  # ------------------------------------------------------------------------
  # Object storage: evidence (WORM), raw captures, samples. Neither 9000 nor 9001 is published;
  # an operator who needs the console forwards a port for one session.
  #
  # Pinned to the same RELEASE tag as the dev file. An upgrade can change how a bucket behaves,
  # so move the tag deliberately, in both files, and only to a release you have tested.
  #
  # TLS on this hop although both ends share a bridge: `config.enforce_environment()` refuses to
  # start unless MINIO_SECURE and SAMPLE_SECURE are "true". SigV4 keeps the secret key off the
  # wire, but every exhibit's bytes cross it, and a request's signature can be lifted and
  # replayed against the evidence bucket until it expires. MinIO finds `public.crt` and
  # `private.key` in its default /root/.minio/certs, so no flag is needed. The operator creates
  # them (infra/production/README.md) with subjectAltName DNS:minio, the name MINIO_ENDPOINT
  # uses; with ./tls empty MinIO serves plain HTTP and every client fails its handshake.
  #
  # MINIO_ACCESS_KEY and MINIO_SECRET_KEY are the API's client credentials and also MinIO's
  # legacy names for its root pair, which this image still reads. env_file cannot filter them,
  # so they are unset before the server starts: once the client account is split off, the
  # server would otherwise hold a credential that is not its own. The rest of secrets.env still
  # reaches it.
  #
  # Not an `environment:` block: these values are secrets, so it would interpolate
  # `${MINIO_ROOT_USER}` from secrets.env, which compose reads only under `--env-file`. Without
  # that flag compose substitutes an empty string and MinIO starts on its built-in
  # minioadmin:minioadmin; `${MINIO_ROOT_USER:?}` would refuse `ps` and `logs` as well.
  #
  # The image's entrypoint prepends `minio` to a command that does not start with it, so a
  # `command:` cannot be a shell. The entrypoint below does what that one does, except switch
  # user under MINIO_USERNAME and MINIO_GROUPNAME, a deprecated path nothing here sets.
  minio:
    # A RELEASE tag, never `latest`: an unpinned third-party tag turns somebody else's change
    # into a red build. quay.io, Docker Hub and dl.min.io do not serve MinIO's community builds
    # to anonymous pullers, so this is the same build, byte for byte, mirrored to the
    # project's GHCR namespace (NOTICE.md names the source). The digest pins what a personal
    # namespace serves and is the one quay.io/minio/minio served for this release, so
    # `docker buildx imagetools inspect` on both names checks the copy.
    image: ghcr.io/dboudreau00/minio:RELEASE.2025-04-22T22-12-26Z@sha256:3f97c5651cb6662b880c787a232b6b34fec8d8922e08d6617b25d241a21164bb
    restart: unless-stopped
    logging: *logging
    networks: [noctornal]
    env_file: [secrets.env]
    environment:
      <<: *no-owner-credential
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    entrypoint:
      - /bin/sh
      - -c
      - |
        unset MINIO_ACCESS_KEY MINIO_SECRET_KEY
        exec minio server /data --console-address ":9001"
    volumes:
      - prod-miniodata:/data
      - ./tls:/root/.minio/certs:ro

  # ------------------------------------------------------------------------
  # Creates the buckets, once; every process that touches storage waits for it to succeed.
  # `restart: "no"`, because `unless-stopped` restarts a container that exited 0 as well.
  #
  # Evidence is created --with-lock. Object lock cannot be switched on later and
  # `--ignore-existing` does not look, but `mc retention set` fails on an unlocked bucket, so
  # `set -e` stops the init and nothing behind it starts; the readiness row
  # evidence_bucket_object_lock says which bucket and that it must be replaced. Its COMPLIANCE
  # 365d default is defence in depth, since `EvidenceStorage.put()` always sets an explicit
  # per-object retention; keep it equal to EVIDENCE_RETENTION_DAYS' default by hand. Nobody,
  # root included, can lift COMPLIANCE before it expires, which is why dev keeps GOVERNANCE.
  #
  # The samples bucket has no lock and no default: a rejected sample must be destroyable
  # (docs/11). The preservation bucket is locked, because a rejected sample is preserved by
  # default under a per-object legal hold that needs a Security Officer to retrieve, but it has
  # no default retention, which would keep a sample after counsel lifted its hold. It is created
  # even under NOCTORNAL_REJECTED_SAMPLE_DISPOSITION=destroy, since switching back needs it.
  #
  # With PRESERVE_ACCESS_KEY and PRESERVE_SECRET_KEY set, its account may write, read and set a
  # hold there and delete nothing. s3:PutObjectLegalHold could also lift a hold, so it is granted
  # only under s3:object-lock-legal-hold = ON. Without them PreservationStorage uses the SAMPLE_*
  # account, which cannot reach the bucket, so a rejection is refused rather than destroying
  # anything.
  #
  # The sample account is a service account confined to the samples bucket, minted with the keys
  # the operator chose in secrets.env. Each policy is one printf format line, since a
  # single-quoted shell string cannot be folded. The `svcacct info` guard makes a rerun a no-op.
  # MinIO takes a service account's access key at 3 to 20 characters and its secret key at 8 to
  # 40, so `keylen` checks all four by name before anything else.
  #
  # A literal block (`|`), not the dev file's folded `>`: in a folded scalar a `#` comments out
  # every command after it, and the literal form keeps every expansion quoted.
  #
  # mc trusts MinIO's certificate from a copy in its CA directory: mounting the directory would
  # put private.key there too, and mounting the file makes docker create a directory in its
  # place when the certificate does not exist yet.
  #
  # The wait for MinIO is bounded, 60 attempts a second apart. With ./tls empty MinIO serves
  # plain HTTP, and with a pair it cannot read it crash-loops, so an unbounded wait would never
  # exit and everything behind it would wait for ever while `up -d` reports success. The message
  # names the URL and both causes, which look alike from here: no TLS there, or root credentials
  # the server did not start with.
  #
  # The root credential reaches mc through MC_HOST_local (mc-alias.sh), never an argument, and
  # mc's config lives under /tmp because /root is 0550 and the container has no capabilities.
  # The SAMPLE_ and PRESERVE_ secret keys remain `--secret-key` arguments of
  # `mc admin user svcacct add`, which has no other input; it runs once per account and each key
  # reaches one bucket. The add prints the new keys on stdout, which `docker logs` would keep, so
  # stdout goes to /dev/null and stderr stays.
  minio-init:
    image: ghcr.io/dboudreau00/mc:RELEASE.2025-08-13T08-35-41Z@sha256:eb4ea9884b77704230e2423e9004d2fa738dc272876b9cc41a297d29443b8780
    depends_on: [minio]
    networks: [noctornal]
    env_file: [secrets.env]
    environment:
      <<: *no-owner-credential
    restart: "no"
    logging: *logging
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./tls:/certs:ro
      - ./mc-alias.sh:/mc-alias.sh:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        keylen() {
          if [ "$${#2}" -lt "$$3" ] || [ "$${#2}" -gt "$$4" ]; then
            echo "minio-init: $$1 is $${#2} characters and MinIO takes $$3 to $$4 for a service account, so the account cannot be created. Choose another in secrets.env (infra/production/README.md, step 1)." >&2
            return 1
          fi
        }
        keylen SAMPLE_ACCESS_KEY "$${SAMPLE_ACCESS_KEY:-}" 3 20
        keylen SAMPLE_SECRET_KEY "$${SAMPLE_SECRET_KEY:-}" 8 40
        if [ -n "$${PRESERVE_ACCESS_KEY:-}" ]; then
          keylen PRESERVE_ACCESS_KEY "$$PRESERVE_ACCESS_KEY" 3 20
          keylen PRESERVE_SECRET_KEY "$${PRESERVE_SECRET_KEY:-}" 8 40
        fi
        . /mc-alias.sh
        mc_setup
        attempts=0
        until mc ls local >/dev/null; do
          attempts=$$((attempts + 1))
          if [ "$$attempts" -ge 60 ]; then
            echo "minio-init: gave up dialling https://minio:9000 after $$attempts tries." >&2
            echo "minio-init: either MinIO is not serving TLS there -- ./tls must hold a" >&2
            echo "minio-init: public.crt and private.key it can read, and an EMPTY ./tls" >&2
            echo "minio-init: gets plain HTTP with no complaint -- or MINIO_ROOT_USER and" >&2
            echo "minio-init: MINIO_ROOT_PASSWORD are not what it started with." >&2
            exit 1
          fi
          sleep 1
        done
        # The three names the code falls back to (EvidenceStorage,
        # RawBatchStorage, SampleStorage) when secrets.env leaves one out, so
        # this creates the bucket the API will look for. Empty counts as left
        # out: `mc mb "local/"` made the bucket of no name and failed the init.
        EVIDENCE="$${EVIDENCE_BUCKET:-noctornal-evidence}"
        INGEST="$${INGEST_BUCKET:-noctornal-raw}"
        SAMPLE="$${SAMPLE_BUCKET:-noctornal-samples}"
        mc mb --ignore-existing --with-lock "local/$$EVIDENCE"
        mc mb --ignore-existing "local/$$INGEST"
        mc mb --ignore-existing "local/$$SAMPLE"
        # Collected raw markup (docs/00 decision 74). NO lock: a retention
        # clock or a deletion order must be able to remove it, and the
        # purge does.
        mc mb --ignore-existing "local/$${COLLECT_RAW_BUCKET:-noctornal-collect-raw}"
        mc retention set --default COMPLIANCE 365d "local/$$EVIDENCE"
        printf '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject"],"Resource":["arn:aws:s3:::%s/*"]},{"Effect":"Allow","Action":["s3:ListBucket","s3:GetBucketLocation"],"Resource":["arn:aws:s3:::%s"]}]}' "$$SAMPLE" "$$SAMPLE" > /tmp/sample-policy.json
        mc admin user svcacct info local "$$SAMPLE_ACCESS_KEY" >/dev/null 2>&1 \
          || mc admin user svcacct add \
               --access-key "$$SAMPLE_ACCESS_KEY" \
               --secret-key "$$SAMPLE_SECRET_KEY" \
               --policy /tmp/sample-policy.json \
               local "$$MINIO_ROOT_USER" >/dev/null
        PRESERVE="$${PRESERVE_BUCKET:-noctornal-preserved}"
        mc mb --ignore-existing --with-lock "local/$$PRESERVE"
        if [ -n "$${PRESERVE_ACCESS_KEY:-}" ]; then
          printf '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:PutObject","s3:GetObject","s3:GetObjectVersion","s3:GetObjectLegalHold"],"Resource":["arn:aws:s3:::%s/*"]},{"Effect":"Allow","Action":["s3:PutObjectLegalHold"],"Resource":["arn:aws:s3:::%s/*"],"Condition":{"StringEquals":{"s3:object-lock-legal-hold":["ON"]}}},{"Effect":"Allow","Action":["s3:ListBucket","s3:GetBucketLocation","s3:GetBucketObjectLockConfiguration"],"Resource":["arn:aws:s3:::%s"]}]}' "$$PRESERVE" "$$PRESERVE" "$$PRESERVE" > /tmp/preserve-policy.json
          mc admin user svcacct info local "$$PRESERVE_ACCESS_KEY" >/dev/null 2>&1 \
            || mc admin user svcacct add \
                 --access-key "$$PRESERVE_ACCESS_KEY" \
                 --secret-key "$$PRESERVE_SECRET_KEY" \
                 --policy /tmp/preserve-policy.json \
                 local "$$MINIO_ROOT_USER" >/dev/null
        fi
        echo 'buckets ready'

  # ------------------------------------------------------------------------
  # The schema, applied by the owner role, once; everything that speaks to the database waits
  # for it to succeed. `restart: "no"`: code ahead of its schema fails on the first query that
  # touches a new column, so a migration that does not apply keeps the API down.
  #
  # Alembic and the application read the same DATABASE_URL and must not run as the same role, so
  # scripts/migrate_job.py sets it from NOCTORNAL_MIGRATION_DATABASE_URL and execs Alembic;
  # compose cannot copy one variable into another without `--env-file` on every command. The job
  # reads migrate.env instead of secrets.env. The file is optional, so a host whose secrets were
  # not moved yet reaches this job, which refuses in one sentence naming the installer step
  # (release/secrets-upgrade/README.md); `required: true` would make compose refuse `ps` and
  # `logs` too. migrate_job.py also refuses an owner DSN that still carries a published value.
  #
  # The image's healthcheck probes the HTTP server, which this container does not run, so it is
  # off here. This is the one service that builds the image, so `pull_policy: missing` overrides
  # the anchor's `never`.
  migrate:
    <<: *noctornal-app
    build:
      context: ../..
      dockerfile: Dockerfile
    pull_policy: missing
    env_file:
      - path: migrate.env
        required: false
    restart: "no"
    healthcheck:
      disable: true
    environment:
      NOCTORNAL_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "scripts/migrate_job.py"]

  # ------------------------------------------------------------------------
  # The application: REST API, the analyst console at /ui and the /api/v1/live WebSocket. It
  # connects as `noctornal_app`, which is not the schema owner and cannot disable a trigger.
  #
  # NOCTORNAL_ENV is set here as well as in secrets.env: `environment:` wins over env_file, so
  # editing a secrets file cannot turn the boot-time refusals off.
  #
  # NOCTORNAL_PUBLIC_ORIGIN comes from secrets.env as the application origin, so
  # `samples.origin_split()` returns "app": this process refuses every sample download and sends
  # the console to NOCTORNAL_SAMPLE_ORIGIN (invariant 10). Both processes get
  # NOCTORNAL_SAMPLE_ORIGIN: this one to point the console there and allow it in the CSP's
  # connect-src, the other to recognise itself.
  #
  # Four workers, because the igraph analytics are CPU-bound and one worker would hold every
  # request behind a betweenness run. Connections are opened per request, so the ceiling is
  # concurrent requests, well inside max_connections=200. Process memory is held four times over:
  # without REDIS_URL each worker meters alone and every limit is four times looser, which is why
  # readiness fails an unset REDIS_URL. NOCTORNAL_LIVE_MAX_SOCKETS (200) and the live channel's
  # pending-message caps are also per worker.
  #
  # --forwarded-allow-ips takes Caddy's address from NOCTORNAL_TRUSTED_PROXY_IP (see x-caddy-ip).
  #
  # SSL_CERT_FILE is the system bundle plus MinIO's certificate, rebuilt in /tmp at each start
  # from the read-only mount. minio-py hands it to urllib3 as `ca_certs`, so for the evidence, raw
  # and sample clients it is the whole set of trusted roots. The other clients (urlopen, SMTP,
  # readiness's PoolManager) also read OpenSSL's SSL_CERT_DIR and would keep the public roots
  # without the concatenation, but not on a base image that stopped shipping its hashed symlinks.
  # `cert_store_stats()` does not count that directory, so it reports one CA where there are many.
  api:
    <<: *noctornal-app
    # The egress client keys, optional to compose so an upgrade starts
    # and the API then refuses by name (config.verify_environment).
    env_file:
      - secrets.env
      - path: egress-client.env
        required: false
    # The analysis worker's socket, read-only: forum pages polled from the console and an
    # analyst's "run static triage now" are parsed there, never in this container.
    volumes:
      - ./tls:/certs:ro
      - analysis-socket:/run/noctornal-analysis:ro
    # /tmp is a size-limited tmpfs. Starlette spools a multipart body over 1 MiB to a temporary
    # file before the route sees who sent it, and a request carrying any bearer value or session
    # cookie is read up to the route's cap, since telling a live credential from a junk one takes
    # the database. In memory the whole cost is capped at 1 GiB, the four workers each spooling
    # one upload at the default 256 MiB cap; a full tmpfs fails only the upload that met it. A
    # larger NOCTORNAL_MAX_EVIDENCE_BYTES or NOCTORNAL_MAX_SAMPLE_BYTES raises this, and the
    # Caddyfile's limit, with it (infra/production/README.md, Upload sizes). Docker forces noexec,
    # nosuid and nodev anyway; they are written out so nobody has to know that.
    tmpfs:
      - /tmp:size=1g,mode=1777,noexec,nosuid,nodev
    environment:
      <<: *no-owner-credential
      NOCTORNAL_ENV: production
      NOCTORNAL_TRUSTED_PROXY_IP: *caddy_ip
      NOCTORNAL_EGRESS_PROXY_URL: "http://172.31.243.11:3128"
      NOCTORNAL_EGRESS_INTERNAL_CIDRS: "172.31.243.0/24,172.31.244.0/24"
      NOCTORNAL_ANALYSIS_SOCKET: /run/noctornal-analysis/worker.sock
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      # Started, not healthy: the console must come up while the proxy
      # does not, and say so on the readiness register.
      egress-proxy:
        condition: service_started
      # The same for the analysis worker: without it analysis is refused
      # and readiness says why, but the console still serves.
      analysis-worker:
        condition: service_started
    command:
      - /bin/sh
      - -c
      - |
        set -e
        cat /etc/ssl/certs/ca-certificates.crt /certs/public.crt > /tmp/ca-bundle.crt
        export SSL_CERT_FILE=/tmp/ca-bundle.crt
        exec uvicorn noctornal_api.http.app:app \
          --host 0.0.0.0 --port 8000 --workers 4 --ws-max-size 8192 \
          --proxy-headers --forwarded-allow-ips "$$NOCTORNAL_TRUSTED_PROXY_IP"

  # ------------------------------------------------------------------------
  # Invariant 10 as a second process: sample bytes are served only from an origin that is not
  # the application's. Same image and code; NOCTORNAL_PUBLIC_ORIGIN is derived from
  # NOCTORNAL_SAMPLE_ORIGIN rather than typed again, so the two cannot disagree.
  #
  # `samples.origin_split()` verdicts: "sample" (this service alone: it serves the bytes), "app"
  # (the api: it refuses every download and names the sample origin), "unconfigured" (no sample
  # origin, so every download refuses), "same_origin" (refused: two names for one origin are not
  # a split) and "invalid" (not an origin, usually because a path was written).
  #
  # The runtime cannot tell a real split from a CNAME onto the same host (docs/16 C9), so that
  # the hostnames are separate stays a human confirmation; this file makes them two processes.
  # Configured as the sample origin, the application serves only what `_allowed_on_sample_origin`
  # in http/app.py allows (the Lab's download, the production of an attacker-markup exhibit,
  # their preflights, /healthz and the readiness register), so the console, the login and every
  # case route 404 here whatever Caddy routes.
  #
  # Two workers: this answers downloads and refusals, not analytics. It shares the api's
  # environment, so it holds the MinIO root credentials that reach the evidence bucket; narrowing
  # that needs a least-privilege service account and has not been done.
  sample-origin:
    <<: *noctornal-app
    # /tmp is a size-limited tmpfs here too, and a small one: this process refuses everything but
    # the two downloads before it reads a body, and their tickets arrive in bodies capped at
    # 2 KiB. 64 MiB holds the 0.2 MiB CA bundle and whatever a library parks there, and is all a
    # request to this origin can cost.
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    environment:
      <<: *no-owner-credential
      NOCTORNAL_ENV: production
      # The system role's DSN bypasses row-level security, and the process that serves hostile
      # bytes must never hold it. This blanks what secrets.env carries; the API refuses to start
      # here if it is set.
      NOCTORNAL_WORKER_DATABASE_URL: ""
      # The same alias the api service carries, for the same reason. It
      # travels through the environment rather than being written into the
      # command because a YAML alias cannot be spliced into a string, and
      # both commands here are shell blocks.
      NOCTORNAL_TRUSTED_PROXY_IP: *caddy_ip
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        set -e
        cat /etc/ssl/certs/ca-certificates.crt /certs/public.crt > /tmp/ca-bundle.crt
        export SSL_CERT_FILE=/tmp/ca-bundle.crt
        export NOCTORNAL_PUBLIC_ORIGIN="$$NOCTORNAL_SAMPLE_ORIGIN"
        exec uvicorn noctornal_api.http.app:app \
          --host 0.0.0.0 --port 8000 --workers 2 --ws-max-size 8192 \
          --proxy-headers --forwarded-allow-ips "$$NOCTORNAL_TRUSTED_PROXY_IP"

  # ------------------------------------------------------------------------
  # The jobs that run on a timer, in a shell loop: the notification drain and the queued outbound
  # lookups. The collection poll runs in the collector, the one holder of the persona key
  # (decision 174). There is no general worker or queue (decision 30): `transports.dispatch_due()`
  # is a function, and without this loop a queued notification would wait until an administrator
  # pressed the button, priority 1 included.
  #
  # Advisory locks make every job safe beside the API and against an overlapping copy of itself:
  # `dispatch_due` holds one lock across the whole drain, so nothing is sent twice.
  #
  # Each job runs about every five minutes, staggered by 150 seconds. `sleep` measures the gap
  # between passes, so the period is 300 seconds plus the passes, and it drifts.
  #
  # No `set -e`: notify_drain.py exits 1 when a delivery failed, which is logged, not a reason to
  # stop draining. The status goes into `rc` on its own line because a `$(date)` in the same
  # command would overwrite `$?` and log exit=0 for every failure.
  #
  # Stopping, here and in lab-triage, lab-cron and embed-pass: the shell is PID 1 and traps TERM
  # and INT, so the job in hand finishes and no other starts. A kill mid-pass would cut a poll, a
  # sandbox send or an email between its effect and its record. A nap is a `wait`, which the
  # trapped signal interrupts at once. stop_grace_period covers a pass (the 240 second budgets,
  # one fetch or send in flight, and slack). No `init: true`: the shell reaps its own children,
  # and init would depend on docker-init on the host. A test runs these scripts and signals them.
  #
  # Healthcheck disabled: no HTTP server here (see the Dockerfile).
  cron:
    <<: *noctornal-app
    stop_grace_period: 330s
    healthcheck:
      disable: true
    env_file:
      - secrets.env
      - path: egress-client.env
        required: false
    # No analysis worker socket: neither drain parses hostile bytes.
    environment:
      <<: *no-owner-credential
      NOCTORNAL_ENV: production
      NOCTORNAL_EGRESS_PROXY_URL: "http://172.31.243.11:3128"
      NOCTORNAL_EGRESS_INTERNAL_CIDRS: "172.31.243.0/24,172.31.244.0/24"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      # Healthy: a drain through a proxy that cannot answer would only fail
      # every delivery and lookup in the pass.
      egress-proxy:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        cat /etc/ssl/certs/ca-certificates.crt /certs/public.crt > /tmp/ca-bundle.crt || exit 1
        export SSL_CERT_FILE=/tmp/ca-bundle.crt
        stop=
        trap 'stop=1' TERM INT
        nap() { sleep "$$1" & wait "$$!"; }
        while [ -z "$$stop" ]; do
          echo "[$$(date -u +%Y-%m-%dT%H:%M:%SZ)] notify_drain start"
          python scripts/notify_drain.py; rc=$$?
          echo "[$$(date -u +%Y-%m-%dT%H:%M:%SZ)] notify_drain exit=$$rc"
          [ -z "$$stop" ] || break
          nap 150
          [ -z "$$stop" ] || break
          # Queued outbound lookups, straight after the drain's nap with no sleep of their own,
          # so every job keeps its five-minute cadence. The cadence is a resolution, not a rate:
          # pacing comes from the provider windows.
          echo "[$$(date -u +%Y-%m-%dT%H:%M:%SZ)] lookup_drain start"
          python scripts/lookup_drain.py; rc=$$?
          echo "[$$(date -u +%Y-%m-%dT%H:%M:%SZ)] lookup_drain exit=$$rc"
          [ -z "$$stop" ] || break
          nap 150
        done
        echo "[$$(date -u +%Y-%m-%dT%H:%M:%SZ)] stopped on request"

  # ------------------------------------------------------------------------
  # The collector: the one service that holds the persona key, so neither the API nor the cron
  # loop can open a persona credential. It runs the persona acts the API queues in
  # collect.persona_act (a Telegram chat looked up, joined, checked, marked or rebound; a Poll
  # now) and, every five minutes, the scheduled collection poll as a child
  # (scripts/collection_poll.py). Five minutes is a resolution, not a timer: each source keeps
  # its own jittered `next_due_at`, because polls exactly 300 seconds apart would mark a persona
  # in a forum's access log (docs/04). The runner locks per source, so a source another runner
  # holds is reported `skipped`, not failed.
  #
  # collector.env carries NOCTORNAL_PERSONA_KEK alone and only this service reads it; it is
  # optional, so an upgrade starts and the collector refuses by name until it exists.
  # NOCTORNAL_COLLECTOR is set here, where no env file can unset it, and every other process
  # refuses to start with it. The poll's forum pages are parsed in the analysis worker, and
  # scripts/collector.py refuses an owner credential as every job does. It takes cron's egress
  # settings: a persona reaches its site only through its own exit.
  #
  # Healthcheck disabled: no HTTP server here (see the Dockerfile).
  collector:
    <<: *noctornal-app
    healthcheck:
      disable: true
    # SIGTERM finishes the act in hand and claims no other (scripts/collector.py). The longest
    # act is a Telegram poll's 120 second session, and the poll child, which ends on SIGTERM at
    # once, gets up to 30 more before it is killed. Docker's default 10 would leave an act
    # RUNNING, to be failed as "outcome unknown" fifteen minutes later. A test holds the number.
    stop_grace_period: 180s
    env_file:
      - secrets.env
      - path: egress-client.env
        required: false
      - path: collector.env
        required: false
    # The collection poll's forum pages are parsed in the analysis worker; its socket, read-only.
    volumes:
      - ./tls:/certs:ro
      - analysis-socket:/run/noctornal-analysis:ro
    environment:
      <<: *no-owner-credential
      NOCTORNAL_ENV: production
      NOCTORNAL_COLLECTOR: "1"
      NOCTORNAL_EGRESS_PROXY_URL: "http://172.31.243.11:3128"
      NOCTORNAL_EGRESS_INTERNAL_CIDRS: "172.31.243.0/24,172.31.244.0/24"
      NOCTORNAL_ANALYSIS_SOCKET: /run/noctornal-analysis/worker.sock
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      egress-proxy:
        condition: service_healthy
      # Started only: a persona act must not wait on it, and a forum source
      # polled while it is down is refused by name.
      analysis-worker:
        condition: service_started
    command:
      - /bin/sh
      - -c
      - |
        cat /etc/ssl/certs/ca-certificates.crt /certs/public.crt > /tmp/ca-bundle.crt || exit 1
        export SSL_CERT_FILE=/tmp/ca-bundle.crt
        exec python scripts/collector.py

  # Static triage and YARA compiles, in a loop of their own: a pass finishes the run it started
  # and a run can take each child its full time limit, which would hold the notification drain
  # back. A deployment that must share a loop can pass --budget SECONDS instead. It reads samples
  # from the object store and sends nothing out. Every step's child runs in the analysis worker:
  # this container decrypts a sample and hands its bytes over the socket, parsing none of them.
  # It waits for the worker to be healthy, since a pass without one would only refuse and exit 1.
  #
  # Healthcheck disabled: no HTTP server here (see the Dockerfile).
  lab-triage:
    <<: *noctornal-app
    stop_grace_period: 330s
    healthcheck:
      disable: true
    env_file:
      - secrets.env
    volumes:
      - ./tls:/certs:ro
      - analysis-socket:/run/noctornal-analysis:ro
    environment:
      <<: *no-owner-credential
      NOCTORNAL_ENV: production
      NOCTORNAL_ANALYSIS_SOCKET: /run/noctornal-analysis/worker.sock
    depends_on:
      migrate:
        condition: service_completed_successfully
      analysis-worker:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        cat /etc/ssl/certs/ca-certificates.crt /certs/public.crt > /tmp/ca-bundle.crt || exit 1
        export SSL_CERT_FILE=/tmp/ca-bundle.crt
        stop=
        trap 'stop=1' TERM INT
        nap() { sleep "$$1" & wait "$$!"; }
        while [ -z "$$stop" ]; do
          echo "[$$(date -u +%Y-%m-%dT%H:%M:%SZ)] lab_triage start"
          python scripts/lab_triage.py; rc=$$?
          echo "[$$(date -u +%Y-%m-%dT%H:%M:%SZ)] lab_triage exit=$$rc"
          [ -z "$$stop" ] || break
          nap 300
        done
        echo "[$$(date -u +%Y-%m-%dT%H:%M:%SZ)] stopped on request"

  # ------------------------------------------------------------------------
  # The isolated analysis worker (noctornal_api.analysis_worker). Static triage and forum
  # parsing read bytes written by the people under investigation, so api, collector and
  # lab-triage hand each such read to this container over a Unix socket instead of starting the
  # bounded child beside their own secrets: on Linux a child can read the environment of every
  # process of its user, which is all of secrets.env, and reach the database over the shared
  # network. It is not a task worker (decision 30): one request per connection, no queue,
  # nothing kept between requests.
  #
  # It does not merge x-noctornal-app, which carries secrets.env, the `noctornal` network and the
  # MinIO certificate; it repeats the image tag and `pull_policy: never` instead, and readiness
  # refuses a worker whose parser versions differ from the API's.
  #
  #   * No env_file: the worker refuses any variable it cannot name, and readiness asks what it
  #     holds. network_mode none: no route, no DNS, no database. A read-only root,
  #     no-new-privileges, and pids and memory limits.
  #   * Nothing a child makes outlives its request. SysV and POSIX IPC objects, /dev/shm and /tmp
  #     would otherwise last until the container is removed, readable by a later child.
  #     `ipc: none` removes /dev/shm, the four sysctls leave a child unable to create a segment,
  #     a queue or a semaphore set, and /tmp is root's, mode 0755. The worker refuses to start
  #     unless each is in place, and readiness fails when its hello reports one open.
  #   * Slot N's child runs as uid 10100+N with no supplementary group, under a task limit, and
  #     every process of that uid is killed before the request is answered: a child with the
  #     worker's uid could replace its socket, or detach a process that answers later requests.
  #     So the worker is root (group 10001) holding only KILL, SETGID and SETUID, and refuses to
  #     start with any other capability, without no-new-privileges, or as PID 1 (init: true
  #     reaps). uids 10100 to 10115 must own nothing on the host; analysis_worker's docstring
  #     says why not a pid namespace per request.
  #   * pids_limit: the worker needs 40 tasks and each slot 20, and it refuses a limit that
  #     cannot hold them (raise it with NOCTORNAL_ANALYSIS_WORKER_CONCURRENCY), an absent one,
  #     or one over four times the need: it is the second wall after the child's own task limit.
  #   * analysis-socket is a tmpfs owned by root, group 10001, mode 0750: only the worker writes
  #     it, a child's uid cannot enter it, and api, collector and lab-triage mount it read-only.
  #
  # Memory: a request holds its payload (a YARA scan: a 256 MiB sample and a build of up to
  # 256 MiB), a child bounded by NOCTORNAL_SAMPLE_ANALYSIS_MEMORY (2 GiB of address space) and
  # its output (8 MiB, or up to 256 MiB for a compile). Two worst-case scans come to about
  # 5.2 GiB with the worker, which 6g holds. Every child ranks first for the OOM killer, so too
  # small a limit costs a crashed step, never the worker. Raise mem_limit with
  # NOCTORNAL_ANALYSIS_WORKER_MAX_BYTES, the sample cap or the concurrency.
  analysis-worker:
    image: noctornal-api:0.9.4
    pull_policy: never
    restart: unless-stopped
    logging: *logging
    network_mode: none
    init: true
    ipc: none
    sysctls:
      kernel.shmmax: 0
      kernel.msgmni: 0
      kernel.sem: "0 0 0 0"
      fs.mqueue.queues_max: 0
    user: "0:10001"
    read_only: true
    tmpfs:
      - /tmp:size=1m,mode=0755,noexec,nosuid,nodev
    cap_drop: [ALL]
    cap_add: [KILL, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 6g
    memswap_limit: 6g
    environment:
      NOCTORNAL_ANALYSIS_SOCKET: /run/noctornal-analysis/worker.sock
      NOCTORNAL_ANALYSIS_WORKER_CONCURRENCY: "2"
    volumes:
      - analysis-socket:/run/noctornal-analysis
    command: ["python", "-m", "noctornal_api.analysis_worker"]
    healthcheck:
      test: ["CMD", "python", "-m", "noctornal_api.analysis_worker", "--check"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s

  # The Lab's prohibited-content screening and sandbox dispatch, in a loop of their own: a
  # screening pass may take 240 seconds and a sandbox pass its budget plus one upload, which in
  # cron's loop would hold back email delivery and urgent-alert escalation. Advisory locks make
  # an overlapping run a no-op. Each exits 1 when something needs an operator (matched bytes not
  # yet preserved, samples behind the newest list, a failed send), and the loop logs it and goes
  # on; sandbox_dispatch.py exits 0 at once when no sandbox is set. It sends to the sandbox, so
  # it takes cron's egress settings and waits for the proxy.
  lab-cron:
    <<: *noctornal-app
    stop_grace_period: 330s
    healthcheck:
      disable: true
    env_file:
      - secrets.env
      - path: egress-client.env
        required: false
    environment:
      <<: *no-owner-credential
      NOCTORNAL_ENV: production
      NOCTORNAL_EGRESS_PROXY_URL: "http://172.31.243.11:3128"
      NOCTORNAL_EGRESS_INTERNAL_CIDRS: "172.31.243.0/24,172.31.244.0/24"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      egress-proxy:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        cat /etc/ssl/certs/ca-certificates.crt /certs/public.crt > /tmp/ca-bundle.crt || exit 1
        export SSL_CERT_FILE=/tmp/ca-bundle.crt
        stop=
        trap 'stop=1' TERM INT
        nap() { sleep "$$1" & wait "$$!"; }
        while [ -z "$$stop" ]; do
          echo "[$$(date -u +%Y-%m-%dT%H:%M:%SZ)] sample_screen start"
          python scripts/sample_screen.py; rc=$$?
          echo "[$$(date -u +%Y-%m-%dT%H:%M:%SZ)] sample_screen exit=$$rc"
          [ -z "$$stop" ] || break
          echo "[$$(date -u +%Y-%m-%dT%H:%M:%SZ)] sandbox_dispatch start"
          python scripts/sandbox_dispatch.py; rc=$$?
          echo "[$$(date -u +%Y-%m-%dT%H:%M:%SZ)] sandbox_dispatch exit=$$rc"
          [ -z "$$stop" ] || break
          nap 300
        done
        echo "[$$(date -u +%Y-%m-%dT%H:%M:%SZ)] stopped on request"

  # The similarity pass: fills and refreshes the similar wording and similar meaning indexes,
  # 240 seconds of work a pass, in a loop of its own so a long pass never holds back the
  # notification drain. Similar meaning, when configured, leaves through the egress proxy's
  # embeddings route, so this takes cron's egress settings.
  #
  # Healthcheck disabled: no HTTP server here (see the Dockerfile).
  embed-pass:
    <<: *noctornal-app
    stop_grace_period: 330s
    healthcheck:
      disable: true
    env_file:
      - secrets.env
      - path: egress-client.env
        required: false
    environment:
      <<: *no-owner-credential
      NOCTORNAL_ENV: production
      NOCTORNAL_EGRESS_PROXY_URL: "http://172.31.243.11:3128"
      NOCTORNAL_EGRESS_INTERNAL_CIDRS: "172.31.243.0/24,172.31.244.0/24"
    depends_on:
      migrate:
        condition: service_completed_successfully
      egress-proxy:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        cat /etc/ssl/certs/ca-certificates.crt /certs/public.crt > /tmp/ca-bundle.crt || exit 1
        export SSL_CERT_FILE=/tmp/ca-bundle.crt
        stop=
        trap 'stop=1' TERM INT
        nap() { sleep "$$1" & wait "$$!"; }
        while [ -z "$$stop" ]; do
          echo "[$$(date -u +%Y-%m-%dT%H:%M:%SZ)] embed_pass start"
          python scripts/embed_pass.py --max-seconds 240; rc=$$?
          echo "[$$(date -u +%Y-%m-%dT%H:%M:%SZ)] embed_pass exit=$$rc"
          [ -z "$$stop" ] || break
          nap 60
        done
        echo "[$$(date -u +%Y-%m-%dT%H:%M:%SZ)] stopped on request"

  # ------------------------------------------------------------------------
  # The egress proxy (docs/00 decision 68), the only way out for the application services: HTTP
  # CONNECT and SOCKS5 on one listener at its fixed internal address, never published and never
  # on a wildcard. It decides each connection by route, logs it in collect.egress_connection and
  # refuses private space unless an administrator's route names it.
  #
  # It reads egress-proxy.env, not secrets.env: it talks to the internet, holds none of the
  # platform's keys, DSNs or store credentials and refuses to start if it finds one. It connects
  # as noctornal_egress (db/init/20-egress-role.sh, migration 0109), which reads the routes and
  # appends to the connection ledger, nothing more. It never reaches the object store.
  #
  # Only the proxy joins `exits` (Tor or VPN sidecars) and `models` (a local model server), so
  # no application service can reach a sidecar's port and leave around it. No integration route
  # can name `exits`. A model on `models` is reached through an embeddings route naming that
  # network (model@172.31.246.0/24:PORT), and one on the host through extra_hosts
  # (host.docker.internal:host-gateway) on this service and an embeddings route naming it.
  #
  # One instance, no failover: when it is down nothing leaves, which is the safe direction.
  egress-proxy:
    <<: *noctornal-app
    env_file:
      - path: egress-proxy.env
        required: false
    volumes: []
    environment:
      <<: *no-owner-credential
      NOCTORNAL_ENV: production
      NOCTORNAL_EGRESS_LISTEN: "172.31.243.11:3128"
      NOCTORNAL_EGRESS_INTERNAL_CIDRS: "172.31.243.0/24,172.31.244.0/24"
    networks:
      noctornal:
        ipv4_address: *egress_ip
      edge:
      exits:
      models:
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "noctornal_api.egress_proxy"]
    healthcheck:
      test: ["CMD", "python", "-m", "noctornal_api.egress_proxy", "--check"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s

# --------------------------------------------------------------------------
# The networks. `noctornal` has a fixed subnet so that Caddy and the egress proxy can hold fixed
# addresses (x-caddy-ip, x-egress-ip).
#
# The subnet is inside Docker's default pool (172.16/12), so an older network on this host can
# already sit on it, and `up` then fails with "Pool overlaps with other one on this address
# space". Pick another /24 and change every key that carries it, as infra/production/README.md
# lists under "If `up` fails creating the network".
#
# `ip_range` deals addresses from the upper half to containers without a fixed one, so none can
# take .10 or .11: a reboot starts every service at once, in no order, and Caddy or the proxy
# would stay down with "Address already in use". `gateway` keeps the gateway at .1, where
# Docker would otherwise move it to the start of the range. A test holds the fixed addresses
# outside the range.
#
# `noctornal` is internal, so nothing on it reaches the internet but through the egress proxy.
# `edge` is the one bridge with a route out, joined by caddy and the proxy alone; its subnet is
# fixed so the deployment's own networks (NOCTORNAL_EGRESS_INTERNAL_CIDRS,
# egress_policy.DEFAULT_INTERNAL_NETWORKS) are known and no route can reach them. The proxy is
# the only other member of `exits` (Tor or VPN sidecars) and `models` (a local model server).
# Whether an internal network really has no route out depends on the host's Docker and
# firewall, which readiness cannot see: infra/production/README.md, Egress, has the check for a
# human to make.
networks:
  noctornal:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.31.243.0/24
          ip_range: 172.31.243.128/25
          gateway: 172.31.243.1
  edge:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.244.0/24
  exits:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.245.0/24
  models:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.31.246.0/24

# --------------------------------------------------------------------------
# There is no backup here beyond these volumes. prod-pgdata is the case
# file, prod-miniodata is the evidence, and both live on one disk on one
# host. Snapshot them somewhere else before you rely on this.
volumes:
  prod-pgdata:
  prod-redisdata:
  prod-miniodata:
  caddy-data:
  caddy-config:
  # The analysis worker's socket alone. A tmpfs, so nothing survives a host restart, owned by
  # root with the application's group: only the worker writes it, and its children's uids
  # cannot enter it.
  analysis-socket:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=1m,uid=0,gid=10001,mode=0750"
