# Development only -- do not derive a prod deployment from this file.
# (Until 2026-09-09 this header cited a three-zone production sketch from
# docs/02; that sketch was superseded. The program is one API process; a
# production deployment puts it behind your own reverse proxy and network
# policy, and runs the sample origin as a second process of the same code.)
name: noctornal

# Every published port is bound to 127.0.0.1 (Alpha 6 pre-release check,
# 2026-09-23). Before that each one was published on every interface, and a
# Linux install put Postgres (as a superuser), the MinIO root, Redis and
# Mailpit on the network behind the passwords written in this file. A host
# firewall is no help: Docker forwards a published port with its own NAT
# rules before ufw's INPUT rules ever see the packet, so the address in
# `ports:` is the only control this file has.
#
# Nothing in the development workflow needs more. The API binds 127.0.0.1,
# minio-init reaches MinIO by service name on the compose network, and the
# installers write 127.0.0.1 into .env.local (an older one that says
# localhost still works). With Docker Engine
# inside WSL 2, WSL forwards a 127.0.0.1 listener in the distribution to the
# Windows host's 127.0.0.1, so that Windows workflow is unchanged.
#
# IPv4 only, on purpose. An explicit [::1] cannot be bound on a host with
# IPv6 disabled, and one unbindable port fails the whole `up`. A client that
# resolves localhost to ::1 first then connects on its second address; on
# Windows that refused first attempt costs about two seconds, and naming
# 127.0.0.1 instead of localhost in .env.local avoids it.
#
# apps/api/tests/test_compose_exposure.py fails on any published port here
# that is not bound to loopback.

services:
  postgres:
    # pgvector image. Ids are uuid4() app-side and gen_random_uuid() in
    # SQL; the pg_uuidv7 idea from the 2026-07 sketch was not taken.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: noctornal
      POSTGRES_USER: noctornal
      POSTGRES_PASSWORD: dev_only_change_me
      # Reduce the noise floor when debugging slow graph queries.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c log_min_duration_statement=250
      -c max_connections=200
      -c shared_buffers=512MB
      -c work_mem=32MB
    ports: ["127.0.0.1:5432:5432"]
    # If init ever fails mid-run, pgdata keeps the PARTIAL cluster and the
    # init scripts will NOT re-run on restart — postgres comes up "healthy"
    # with a half-loaded schema. Recover with: docker compose down -v
    # (destroys pgdata), then up again.
    # Initdb runs ONLY db/init, which is two scripts: 00-extensions.sql,
    # because CREATE EXTENSION needs superuser, and 10-app-role.sh, which
    # creates the production least-privilege role and does NOTHING here —
    # it wants NOCTORNAL_APP_DB_PASSWORD, this file sets no such variable,
    # and it says so on stdout rather than failing. So this stack connects
    # as the owner exactly as it always has. The schema itself comes from
    # Alembic: `alembic upgrade head` from the repo root — one owner of the
    # schema, no drift.
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../db/init:/docker-entrypoint-initdb.d:ro
    # -h 127.0.0.1 forces the probe over TCP: during first-run init the
    # entrypoint's temporary server answers on the unix socket only, and a
    # socket probe reports "healthy" while the schema is still loading.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U noctornal -d noctornal"]
      interval: 5s
      retries: 10
      start_period: 30s

  # The rate limiter is the only user of this Redis, and its GCRA meters must
  # not be evicted: a deleted meter admits the subject it was refusing with a
  # full burst. So `noeviction` (Alpha 6 pre-release check, 2026-09-23). This
  # file ran `allkeys-lru`, which made every start of the API print RATE-LIMIT
  # REDIS EVICTS KEYS and left readiness' redis_limiter_store red on a fresh
  # install, over a setting the bundled stack chose and the user never did.
  # At the 1gb cap Redis now refuses writes instead of deleting meters, and
  # each limit falls back to its declared on_backend_failure.
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 1gb --maxmemory-policy noeviction
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redisdata:/data]

  minio:
    # The registry, and the tag, are both deliberate. This is the SECOND time
    # an unpinned MinIO image has failed CI on a repository whose own code had
    # not changed: `bitnami/minio:latest` stopped resolving on 2026-07-26 when
    # Bitnami moved their catalogue, and on 2026-09-16 `minio/minio:latest` on
    # Docker Hub began answering "pull access denied for minio/minio,
    # repository does not exist or may require 'docker login'" to an
    # unauthenticated puller. Reproduced locally the same day, on a machine
    # that had pulled it a week earlier.
    #
    # So: quay.io, which MinIO publishes to directly, and a RELEASE tag rather
    # than `latest`, because the lesson of both outages is that an unpinned
    # third-party tag is a dependency on somebody else's decisions that arrives
    # as a red build with no local change to explain it.
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: noctornal
      MINIO_ROOT_PASSWORD: dev_only_change_me
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [miniodata:/data]

  # Creates the evidence bucket WITH OBJECT LOCK. Object lock cannot be
  # enabled after creation, so getting this right on first run matters.
  #
  # `set -e` + `--ignore-existing` instead of `|| true`: a silently failed
  # lock-enabled creation is unrecoverable, so real failures must fail this
  # container visibly.
  #
  # R10 (2026-07-26) added `noctornal-samples`, which was created by
  # nothing. The store defaults to that name, so the first real sample
  # upload got an uncurated NoSuchBucket where every other refusal in this
  # system explains itself. The dev machine never hit it because
  # seed_lab_demo.py deliberately uses a null store.
  #
  # The samples bucket is NOT --with-lock, and this is the one bucket where
  # that needs saying out loud: docs/11's rejection path must be able to
  # DESTROY sample bytes when prohibited content arrives, and an object
  # lock would make that impossible for the whole retention period.
  # Evidence is locked because an exhibit must survive; a sample is not,
  # because some samples must not.
  #
  # `noctornal-preserved` (F2, 2026-09-22) IS --with-lock, with NO default
  # retention. A rejected sample is preserved there by default rather than
  # destroyed: `reject()` copies its ciphertext in under a per-object LEGAL
  # HOLD and keeps the data key, and getting it back out needs a Security
  # Officer's authorisation (docs/11). The hold is per object and has no
  # expiry, so a bucket default would add nothing but a clock. Object lock
  # cannot be switched on after creation, which is why the bucket is made
  # here on first run rather than by the first rejection.
  #
  # EVERY comment about this command lives OUT HERE. `entrypoint: >` is a
  # YAML *folded* scalar: it joins its lines with spaces into one string,
  # so a `#` inside it comments out the rest of the entire shell command.
  # A comment added inside the block on 2026-07-26 silently disabled the
  # samples-bucket creation it was written to explain, and `docker compose
  # config` was what caught it.
  #
  # The wait for MinIO is quiet, and bounded (Alpha 6 pre-release check,
  # 2026-09-23). minio-init starts as soon as the minio container does, before
  # the server listens, so the first `mc alias set` always failed and every
  # clean start's log opened with "mc: <ERROR> Unable to initialize new
  # alias ... connection refused": the expected first pass of the wait, and
  # the line anyone reading the log after an unrelated failure would take
  # for its cause. The wait now discards the probe's output. To keep a real
  # fault (a wrong password, say) from looping forever in silence, after 120
  # attempts it runs the probe once more with its output shown and exits 1
  # if that fails too. `$$` is compose's escape for a literal `$`.
  # test_compose_exposure.py runs this script with a stub `mc`.
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      set -e;
      tries=0;
      until mc alias set local http://minio:9000 noctornal dev_only_change_me >/dev/null 2>&1; do
      tries=$$((tries + 1));
      if [ $$tries -ge 120 ]; then mc alias set local http://minio:9000 noctornal dev_only_change_me || exit 1; fi;
      sleep 1;
      done;
      mc mb --ignore-existing --with-lock local/noctornal-evidence;
      mc mb --ignore-existing local/noctornal-raw;
      mc mb --ignore-existing local/noctornal-samples;
      mc mb --ignore-existing --with-lock local/noctornal-preserved;
      mc retention set --default GOVERNANCE 365d local/noctornal-evidence;
      echo 'buckets ready';
      "

  # Named `mailpit` after the image it actually runs. It was `mailhog`
  # for historical reasons and the mismatch confused anyone reading
  # `docker compose ps` against the docs (R21).
  mailpit:
    # A release tag, not `latest` (sec-pin-dependencies, 2026-09-23), for
    # the reason the minio note above gives twice over. v1.31.0 is the build
    # this stack ran while the Alpha 6 suite passed (index digest
    # sha256:c96991d9bef7...), and it resolved for an anonymous pull from
    # Docker Hub the day it was pinned, as it did from ghcr.io/axllent/mailpit
    # under the same digest, the mirror to move to if Docker Hub ever goes the
    # way it went for MinIO. CI runs the same tag, and
    # apps/api/tests/test_dependency_pins.py fails if the two differ.
    image: axllent/mailpit:v1.31.0
    # 1025 SMTP, 8025 web UI. install.ps1/install.sh write matching
    # SMTP_HOST/SMTP_PORT/SMTP_ALLOW_PLAINTEXT into .env.local, or the
    # advertised "captured e-mail" demo silently does nothing (R11) --
    # transports.py defaults to port 587.
    #
    # --smtp-disable-rdns (Alpha 6 pre-release check, 2026-09-23): Mailpit
    # looks up the reverse DNS of every SMTP client before it sends its
    # greeting, and where that lookup is slow the greeting waits for it. On
    # the development machine the greeting took 1 to 10 seconds, with or
    # without the loopback bind, and transports.send_smtp gives up after 10.
    # With the lookup off it arrives at once. Nothing here uses the name.
    command: --smtp-disable-rdns
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]

# ---------------------------------------------------------------------------
# REMOVED 2026-07-26 (R13): OpenFGA and NATS.
#
# Both were scaffolding for a design direction the build did not take.
# Neither is referenced by a single line in apps/api -- verified by grep --
# yet between them they published FOUR host ports (8080, 3001, 4222, 8222)
# and one port collision fails the ENTIRE `docker compose up`, taking the
# install with it. 8080 in particular is among the most contended ports on
# a developer workstation.
#
# So they were pure risk: no function, and a plausible way for a first-run
# install to fail with an error about a service the product never calls.
# Ten published ports became six.
#
# docs/02 named OpenFGA/SpiceDB as the intended relationship-based (marked
# superseded there on 2026-09-09; the five-part gate lives in Postgres)
# authorisation store. It is not the plan any more: the five-part gate in
# `deps.py` is the implementation, entirely in Postgres, and nothing is
# waiting on a ReBAC service. If one is ever adopted it comes back here
# with code calling it, not before.
#
# NOTE for anyone re-adding OpenFGA: `openfga-migrate` declared
# `depends_on: postgres: service_healthy`, which had the side effect of
# making `up -d` block until Postgres was genuinely ready. install.sh's
# wait-loop relied on that without knowing it. R17 added an explicit
# failure branch to that loop for exactly this reason.

volumes:
  pgdata:
  redisdata:
  miniodata:
