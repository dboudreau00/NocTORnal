# Development only: do not derive a production deployment from this file. Production runs one API
# process behind a reverse proxy, with the sample origin as a second process of the same code
# (infra/production/).
name: noctornal

# Every published port is bound to 127.0.0.1: published on every interface, Postgres (as a
# superuser), the MinIO root, Redis and Mailpit would sit on the network behind the passwords in
# this file, and a host firewall is no help, since Docker's NAT forwards a published port before
# ufw sees it. Nothing in development needs more, and WSL 2 forwards a 127.0.0.1 listener to the
# Windows host's. IPv4 only: an explicit [::1] cannot be bound with IPv6 disabled, and one
# unbindable port fails the whole `up`; the installers write 127.0.0.1, not localhost, into
# .env.local to spare a refused ::1 attempt. test_compose_exposure.py fails on any port not bound
# to loopback.

services:
  postgres:
    # pgvector image. Ids are uuid4() app-side and gen_random_uuid() in SQL, not UUIDv7. Every
    # image in this file is pinned by digest, as the production stack's are (docs/17, "unpinned
    # inputs"): the tag is for the reader and the digest is what Docker pulls. Where an image is
    # shared, the digest is the one infra/production/compose.yml pins; infra/production/README.md,
    # Hardening, says how to move one.
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      POSTGRES_DB: noctornal
      POSTGRES_USER: noctornal
      POSTGRES_PASSWORD: dev_only_change_me
      # Reduce the noise floor when debugging slow graph queries.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    # log_parameter_max_length=0 and its _on_error twin keep bind parameters out of the log of a
    # slow or failed statement for every role, as the production file does, the owner this stack
    # connects as included. A comment cannot go inside the folded block below.
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c log_min_duration_statement=250
      -c log_parameter_max_length=0
      -c log_parameter_max_length_on_error=0
      -c max_connections=200
      -c shared_buffers=512MB
      -c work_mem=32MB
    ports: ["127.0.0.1:5432:5432"]
    # If init fails mid-run, pgdata keeps the partial cluster and the init scripts do not re-run:
    # postgres comes up "healthy" with a half-loaded schema. Recover with `docker compose down -v`
    # (destroys pgdata), then up again. Initdb runs only db/init: 00-extensions.sql, since CREATE
    # EXTENSION needs superuser, and 10-app-role.sh, which does nothing here without
    # NOCTORNAL_APP_DB_PASSWORD, so this stack connects as the owner. The schema comes from
    # Alembic alone (`alembic upgrade head` from the repo root).
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../db/init:/docker-entrypoint-initdb.d:ro
    # -h 127.0.0.1 forces the probe over TCP: during first-run init the
    # entrypoint's temporary server answers on the unix socket only, and a
    # socket probe reports "healthy" while the schema is still loading.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U noctornal -d noctornal"]
      interval: 5s
      retries: 10
      start_period: 30s

  # The rate limiter is the only user of this Redis, and its GCRA meters must not be evicted: a
  # deleted meter admits the subject it was refusing with a full burst. So `noeviction`, which
  # readiness' redis_limiter_store check expects; at the 1gb cap Redis refuses writes instead, and
  # each limit falls back to its declared on_backend_failure.
  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: redis-server --appendonly yes --maxmemory 1gb --maxmemory-policy noeviction
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redisdata:/data]

  minio:
    # A pinned RELEASE build rather than `latest`: an unpinned third-party tag is a dependency on
    # somebody else's decisions. Public registries do not serve MinIO's community builds to
    # anonymous pullers, so this is the same build mirrored byte for byte to this project's GHCR
    # namespace (NOTICE.md names the upstream source).
    image: ghcr.io/dboudreau00/minio:RELEASE.2025-04-22T22-12-26Z@sha256:3f97c5651cb6662b880c787a232b6b34fec8d8922e08d6617b25d241a21164bb
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: noctornal
      MINIO_ROOT_PASSWORD: dev_only_change_me
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [miniodata:/data]

  # Creates the buckets. Object lock cannot be enabled after creation, so the locked buckets are
  # made here on first run, and `set -e` with `--ignore-existing` (not `|| true`) makes a failed
  # creation fail this container visibly. The evidence bucket is locked because an exhibit must
  # survive; the samples bucket is not, because docs/11's rejection path must be able to destroy
  # sample bytes. noctornal-preserved is locked with no default retention: `reject()` preserves a
  # sample there under a per-object legal hold with no expiry, and getting it out needs a Security
  # Officer's authorisation (docs/11).
  #
  # Every comment about this command lives out here: `entrypoint: >` is a folded scalar that joins
  # its lines, so a `#` inside it comments out the rest of the shell command. The wait for MinIO
  # is quiet, since its first probes fail while the server starts, and bounded: after 120 attempts
  # it runs the probe once more with its output shown and exits 1 if that fails too. `$$` is
  # compose's escape for a literal `$`. test_compose_exposure.py runs this script with a stub `mc`.
  minio-init:
    image: ghcr.io/dboudreau00/mc:RELEASE.2025-08-13T08-35-41Z@sha256:eb4ea9884b77704230e2423e9004d2fa738dc272876b9cc41a297d29443b8780
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      set -e;
      tries=0;
      until mc alias set local http://minio:9000 noctornal dev_only_change_me >/dev/null 2>&1; do
      tries=$$((tries + 1));
      if [ $$tries -ge 120 ]; then mc alias set local http://minio:9000 noctornal dev_only_change_me || exit 1; fi;
      sleep 1;
      done;
      mc mb --ignore-existing --with-lock local/noctornal-evidence;
      mc mb --ignore-existing local/noctornal-raw;
      mc mb --ignore-existing local/noctornal-samples;
      mc mb --ignore-existing local/noctornal-collect-raw;
      mc mb --ignore-existing --with-lock local/noctornal-preserved;
      mc retention set --default GOVERNANCE 365d local/noctornal-evidence;
      echo 'buckets ready';
      "

  mailpit:
    # A release tag pinned by digest, not `latest`, for the reason the minio note gives. The same
    # digest is published at ghcr.io/axllent/mailpit, the mirror to move to if Docker Hub stops
    # serving it. CI runs the same tag, and test_dependency_pins.py fails if the two differ.
    image: axllent/mailpit:v1.31.0@sha256:c96991d9bef73594c246d89ca81411d4e916f03e76a7d2d72fa2ab5dd3c9ce24
    # 1025 SMTP, 8025 web UI. install.ps1 and install.sh write matching SMTP_HOST, SMTP_PORT and
    # SMTP_ALLOW_PLAINTEXT into .env.local, or the "captured e-mail" demo silently does nothing:
    # transports.py defaults to port 587. --smtp-disable-rdns: Mailpit's reverse lookup of each
    # client can hold its greeting for seconds, and transports.send_smtp gives up after 10.
    command: --smtp-disable-rdns
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]

volumes:
  pgdata:
  redisdata:
  miniodata:
