[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "noctornal-api"
version = "0.1.0"
description = "NocTORnal API: FastAPI service. Session 3 lands authentication (Argon2id + TOTP + server-side sessions)."
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=23.1",   # Argon2id password + recovery-code hashing
    "cryptography>=42.0",  # AES-256-GCM envelope for TOTP secrets at rest
    "psycopg[binary]>=3.1",
    "minio>=7.2",          # WORM object storage for evidence (object lock)
    "blake3>=0.4",         # second independent integrity anchor for evidence
    # noctornal-ontology is a sibling package in this monorepo (the ONE
    # source of selector normalisers). Install it editable alongside:
    #   pip install -e packages/ontology -e apps/api
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
