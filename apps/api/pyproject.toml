[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "noctornal-api"
version = "0.1.0"
description = "NocTORnal API: FastAPI service. Session 3 lands authentication (Argon2id + TOTP + server-side sessions)."
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=23.1",   # Argon2id password + recovery-code hashing
    "cryptography>=42.0",  # AES-256-GCM envelope for TOTP secrets at rest
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
