[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "noctornal-api"
# The ONE declaration of the version. `noctornal_api.__version__` reads this
# file (or, for a wheel, the metadata built from it) and carries no literal of
# its own. Until 2026-09-09 the package said "0.4.0" while this said "0.1.0",
# and nothing read both, so the packaging metadata and the OpenAPI document
# disagreed for three releases. apps/api/tests/test_version_contract.py holds
# every reporter of the version to this line.
version = "0.7.0"
description = "NocTORnal API: the FastAPI service. One process serving the REST API, the analyst console and the live channel over Postgres, Redis and S3-compatible object storage."
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=23.1",   # Argon2id password + recovery-code hashing
    # AES-256-GCM envelope for TOTP secrets at rest. 47 or later since the
    # 2026-09 roadmap build: the egress proxy seals its exits with the hpke
    # module, first shipped in 47.0.0 (2026-09-24).
    "cryptography>=47.0",
    "psycopg[binary]>=3.1",
    "minio>=7.2",          # WORM object storage for evidence (object lock)
    "blake3>=0.4",         # second independent integrity anchor for evidence
    "fastapi>=0.110",      # REST API
    "uvicorn>=0.29",       # ASGI server
    # FastAPI needs this for EVERY `Form(...)` and `UploadFile` parameter,
    # and it does not depend on it — it raises at REQUEST time with
    # "Form data requires python-multipart to be installed".
    #
    # Found 2026-07-26 by installing the packaged release into a clean
    # venv and running the suite there: 117 errors that do not occur on
    # the development machine, whose venv acquired the package by hand
    # long ago (`pip show` reports an empty `Required-by`).
    #
    # This is R3's shape and worse. R3 (alembic) failed loudly at install
    # time. This one installs cleanly, passes every test that does not
    # touch a multipart route, and then fails the first time an analyst
    # uploads an exhibit, a sample or a `.eml` — the three routes that
    # matter most. Nothing in 1257 passing tests on this machine could
    # have caught it, because this machine had the package.
    "python-multipart>=0.0.9",
    # WebSocket transport for /api/v1/live. uvicorn will not serve a
    # WebSocket route without one of these installed -- it declines the
    # upgrade and the client falls back to manual refresh, silently. A
    # feature that degrades invisibly when a dependency is missing is one
    # that will be missing in production, so it is a hard dependency
    # rather than an extra.
    "websockets>=12.0",
    # Rate limiting. Redis is the only shared state the limiter needs, and
    # it needs it to be atomic -- the GCRA meter is read, decided and
    # written by one Lua script (ratelimit_redis.py). Without this package
    # the limiter still runs, per process, and says so loudly at startup.
    "redis>=5.0",
    # SNA maths (docs/02: "igraph, not NetworkX" -- NetworkX is pure Python
    # and falls over around 50k edges when you ask for betweenness). Both
    # ship abi3 wheels, so they install on any CPython >= 3.9 without a
    # build toolchain.
    "igraph>=0.11",
    "leidenalg>=0.10",     # Leiden, not Louvain: Louvain can produce
                           # internally disconnected communities (docs/03)
    # R3 (2026-07-26): alembic and SQLAlchemy are RUNTIME dependencies of
    # this application, not a separate database-tooling concern.
    #
    # They lived only in `db/requirements.txt`, which nothing installed.
    # `pip show alembic` reported an empty `Required-by:`, and both
    # installers ran `pip install -e packages/ontology -e apps/api` and
    # then invoked alembic -- so every clean machine died at the migration
    # step (`.venv/bin/alembic: No such file or directory` on Linux; a
    # correct-but-fatal remedy message on Windows). The dev machine never
    # felt it because its venv predates the installers.
    #
    # The schema is not optional: this product does not start without its
    # migrations, so the thing that applies them is a dependency.
    "alembic>=1.13",
    "SQLAlchemy>=2.0",     # alembic's own requirement, pinned explicitly
    # The 2026-09 roadmap build (2026-09-24). Each ships wheels for
    # CPython 3.12 to 3.14 on Linux, Windows and macOS (or is pure Python),
    # re-checked that day, so each is a hard dependency rather than an
    # extra whose absence the product would have to show as a gap.
    "numpy>=2.3",          # CONCOR positional analysis (analytics F1)
    # Forum HTML, the lexbor backend only. Capped below 0.5, which may move
    # the lexbor API the forum adapters are written against.
    "selectolax>=0.4.12,<0.5",
    "pefile>=2024.8.26",   # static triage of PE samples (F11)
    # Imported directly (the sample stores, readiness's object-store probe)
    # and until now inherited only through minio: a dependency the code
    # imports is declared, not borrowed.
    "urllib3>=2.2",
    "certifi>=2024.2",
    "idna>=3.6",           # egress_policy's UTS-46 host normalisation
    # noctornal-ontology is a sibling package in this monorepo (the ONE
    # source of selector normalisers). Install it editable alongside:
    #   pip install -e packages/ontology -e apps/api
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",         # FastAPI TestClient
    "qrcode>=7.4",         # scannable TOTP enrolment in scripts/bootstrap.py
    "ruff==0.6.9",         # lint; PINNED so CI and a laptop cannot
                           # disagree about what "clean" means
    # The egress wire-contract cases prove python-socks authenticates to the
    # proxy on both of its protocols, which is the contract Telethon uses.
    "python-socks>=3.1",
]
# Opt-in, only if you collect from Telegram. pyaes, which telethon needs,
# is published only as a pure-Python sdist (pip builds it with setuptools
# and no compiler). Without the extra, the telegram_collection readiness
# row says so and every Telegram act refuses with the install line.
telegram = [
    "telethon>=1.45,<2",
    "python-socks>=3.1",   # Telethon's SOCKS5 client to the egress proxy
]
# Opt-in: YARA scanning of samples with yara-x, whose macOS wheels need
# macOS 14 or newer. Without it, the samples readiness caveat names the gap.
yara = [
    "yara-x>=1.20",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "extras_absent: runs in the CI job that installs no optional extra",
]
# A marked test is written for the telegram and yara extras NOT being
# installed, so it fails wherever they are: deselected by default, and run
# by the CI leg that installs no extra, whose own `-m extras_absent`
# replaces this one (2026-09-24).
addopts = "-m 'not extras_absent'"
